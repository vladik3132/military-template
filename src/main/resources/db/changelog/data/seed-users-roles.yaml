databaseChangeLog:
  - changeSet:
      id: seed-001-default-roles
      author: student
      description: Insert default user roles
      changes:
        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: ROLE_ADMIN
              - column:
                  name: description
                  value: Повний доступ до системи
        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: ROLE_OPERATOR
              - column:
                  name: description
                  value: Виконання операцій з транспортом
        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: ROLE_VIEWER
              - column:
                  name: description
                  value: Тільки перегляд даних
      rollback:
        - delete:
            tableName: roles
            where: name IN ('ROLE_ADMIN', 'ROLE_OPERATOR', 'ROLE_VIEWER')

  - changeSet:
      id: seed-002-default-admin
      author: student
      description: Insert default admin user
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: username
                  value: admin
              - column:
                  name: email
                  value: admin@viti.edu.ua
              - column:
                  name: password
                  value: $2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy
              - column:
                  name: full_name
                  value: System Administrator
              - column:
                  name: military_rank
                  value: Полковник
              - column:
                  name: enabled
                  valueBoolean: true
        - sql:
            sql: INSERT INTO user_roles (user_id, role_id) SELECT u.id, r.id FROM users u, roles r WHERE u.username = 'admin' AND r.name = 'ROLE_ADMIN'
      rollback:
        - delete:
            tableName: users
            where: username = 'admin'
