spring:
  application:
    name: military-warehouse-api

  datasource:
    url: jdbc:postgresql://localhost:5432/military_db
    username: military_user
    password: military_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Liquibase Configuration
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    drop-first: false

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 3600000

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# JWT Configuration
app:
  jwt:
    secret: VerySecretKeyThatShouldBeAtLeast256BitsLongForHS256AlgorithmSecurityPurpose123
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    ua.edu.viti.military: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
